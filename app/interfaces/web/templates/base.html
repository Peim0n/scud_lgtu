<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}IS SCUD Admin{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <nav class="navbar">
        <div class="brand">IS SCUD Admin</div>
        <ul class="nav-links">
            <li><a href="{{ url_for('index') }}">Статус</a></li>
            <li><a href="{{ url_for('network_page') }}">Сеть</a></li>
            <li><a href="{{ url_for('backend_page') }}">Бэкенд / доступ</a></li>
            <li><a href="{{ url_for('cert_page') }}">Сертификат</a></li>
            <li><a href="{{ url_for('auth_page') }}">Учётные данные</a></li>
        </ul>
    </nav>
    <main class="container">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <div class="flash-messages">
                    {% for category, message in messages %}
                        <div class="flash flash-{{ category }}">{{ message }}</div>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}
        {% block content %}{% endblock %}
    </main>
</body>
</html>
