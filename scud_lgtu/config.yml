# ── GPIO-контроллер (абстракция над gpiod) ──
# Мапинг логических имен пинов на реальные gpiod пины
gpiod_controller:
  pins:
    # Пины для сдвигового регистра
    shift_data: PA6
    shift_clk: PA19
    shift_latch: PA7

    # Пины для мультиплексора
    mux_a0: PA6
    mux_a1: PA11
    mux_a2: PA12
    mux_input: PL11

    # Пины для Wiegand-считывателей
    wiegand1_d0: PA10
    wiegand1_d1: PA2
    wiegand2_d0: PA3
    wiegand2_d1: PA18

# ── Аппаратные модули (инфраструктура) ──

# Секция shift_register: конфигурация для класса ShiftRegister
shift_register:
  ser_data: "gpiod_controller.shift_data"
  ser_clk: "gpiod_controller.shift_clk"
  ser_latch: "gpiod_controller.shift_latch"
  reg_len: 16
  pins:
    beep1: {offset: 3, inverted: false}
    beep2: {offset: 11, inverted: false}
    main_beeper: {offset: 8, inverted: false}
    green1: {offset: 1, inverted: false}
    red1: {offset: 2, inverted: false}
    green2: {offset: 9, inverted: false}
    red2: {offset: 10, inverted: false}
    rel1: {offset: 14, inverted: false}
    rel2: {offset: 15, inverted: false}
    pult_buzz: {offset: 4, inverted: false}
    pult_l3: {offset: 5, inverted: false}
    pult_l2: {offset: 6, inverted: false}
    pult_l1: {offset: 7, inverted: false}
    od1: {offset: 12, inverted: false}
    od2: {offset: 13, inverted: false}

# Секция mux: конфигурация для класса Multiplexer
mux:
  addr_pins:
    A0: "gpiod_controller.mux_a0"
    A1: "gpiod_controller.mux_a1"
    A2: "gpiod_controller.mux_a2"
  input_pin: "gpiod_controller.mux_input"
  inputs:
    input_0: {addr: 0}
    button_3: {addr: 1}
    sensor_2: {addr: 2, direction: "out", zone: "zone1"}
    input_3: {addr: 3}
    sensor_1: {addr: 4, direction: "in", zone: "zone1"}
    button_1: {addr: 5}
    alarm: {addr: 6, active_high: true}
    button_2: {addr: 7}

# ── Единый каскад мапингов ──
# Бизнес-имена → module.local_name
mappings:
  # Биперы
  entry_beeper: "shift_register.beep1"
  exit_beeper: "shift_register.beep2"
  main_buzzer: "shift_register.main_beeper"

  # Индикаторы
  inner_indicator_success: "shift_register.green1"
  inner_indicator_fail: "shift_register.red1"
  outer_indicator_success: "shift_register.green2"
  outer_indicator_fail: "shift_register.red2"

  # Реле
  entry_relay: "shift_register.rel1"
  exit_relay: "shift_register.rel2"

  # Кнопки и датчики (через мультиплексор)
  entry_button: "mux.button_1"
  exit_button: "mux.button_2"
  alarm_input: "mux.alarm"
  entry_sensor: "mux.sensor_1"
  exit_sensor: "mux.sensor_2"

  # Мапинг полных имён считывателей на логические
  wiegand_Wiegand-1: entry_card_reader
  wiegand_Wiegand-2: exit_card_reader
  serial_Serial-1: entry_qr_reader
  serial_Serial-2: exit_qr_reader

# ── Wiegand-считыватели ──
wiegand:
  - label: Wiegand-1
    d0: 10  # PA10
    d1: 2   # PA2
    type: era_mf_64_hash
    encrypted: false

  - label: Wiegand-2
    d0: 3   # PA3
    d1: 18  # PA18
    type: era_mf_64_hash
    encrypted: false

# ── Серийные порты (старая секция для обратной совместимости) ──
# Для QR-считывателей и других устройств с последовательным интерфейсом
serial:
  - label: Serial-1
    port: /dev/ttyS1
    baud: 115200     # Скорость передачи (baud)
    timeout: 0.05

  - label: Serial-2
    port: /dev/ttyS2
    baud: 115200     # Скорость передачи (baud)
    timeout: 0.05

# ── Функциональные устройства ──
# Конфигурация считывателей с ссылками на бизнес-секцию
devices:
  readers:
    entry_card_reader:
      label: "Wiegand-1"
      type: "wiegand"
      direction: "entry"
      beeper: "entry_beeper"
      indicator_success: "inner_indicator_success"
      indicator_fail: "inner_indicator_fail"

    exit_card_reader:
      label: "Wiegand-2"
      type: "wiegand"
      direction: "exit"
      beeper: "exit_beeper"
      indicator_success: "outer_indicator_success"
      indicator_fail: "outer_indicator_fail"

    entry_qr_reader:
      label: "Serial-1"
      type: "serial"
      direction: "entry"
      beeper: "entry_beeper"
      indicator_success: "inner_indicator_success"
      indicator_fail: "inner_indicator_fail"

    exit_qr_reader:
      label: "Serial-2"
      type: "serial"
      direction: "exit"
      beeper: "exit_beeper"
      indicator_success: "outer_indicator_success"
      indicator_fail: "outer_indicator_fail"

  buttons:
    entry_button:
      label: "button_1"
      action: "open_entry"

    exit_button:
      label: "button_2"
      action: "open_exit"

    shift_button:
      label: "button_3"
      action: "shift"

# ── Зоны прохода ──
passage:
  zones:
    - label: "zone1"
      inner: "sensor_1"  # Внутренний датчик (вход)
      outer: "sensor_2"  # Внешний датчик (выход)


turnstile:
  entry_relay: "entry_relay"
  exit_relay: "exit_relay"
  main_buzzer: "main_buzzer"
  entry_green: "inner_indicator_success"
  entry_red: "inner_indicator_fail"
  exit_green: "outer_indicator_success"
  exit_red: "outer_indicator_fail"

# ── Параметры доступа ──
# STATIC_KEY — уникален для точки доступа (16 байт в hex).
# DYNAMIC_KEY — меняется ежедневно (16 байт в hex).
access:
  static_key: "0123456789abcdef0123456789abcdef"
  dynamic_key: "fedcba9876543210fedcba9876543210"

# ── QR декодер ──
qr_decoder:
  keys_dir: "infrastructure/keys"

# ── Бэкенд ──
backend:
  base_url: "https://api.pass.lipetsk.ru"

# ── Звук ──
sound:
  sound_dir: "sounds"
  player_cmd: "aplay"

# ── Общие системные тайминги ──
timings:
  # GPIO / multiplexer
  mux_poll_interval_s: 0.02
  mux_addr_settle_s: 0.0001
  mux_queue_timeout_s: 0.1

  # Wiegand
  wiegand_bit_timeout_s: 0.025
  wiegand_wait_timeout_s: 0.005
  wiegand_ignore_after_valid_s: 0.05

  # Serial
  serial_queue_timeout_s: 0.2
  serial_retry_delay_s: 1.0

  # Generic event/command loops
  event_queue_timeout_s: 0.2
  command_queue_timeout_s: 0.2
  event_queue_maxsize: 1000
  command_queue_maxsize: 100

  # Passage detection
  passage_timeout_s: 2.0
  passage_blockage_timeout_s: 5.0

  # Turnstile / UI
  auth_timeout_s: 5.0
  relay_open_duration_s: 7.0
  indicator_duration_s: 2.0
  button_timer_duration_s: 7.0
  button_debounce_s: 0.025
  shift_short_press_max_s: 0.5
  post_blockage_safety_s: 1.0
  beep_signal_duration_s: 0.05
  open_beep_duration_s: 0.1
  deny_beep_duration_s: 0.1
  deny_beep_pause_s: 0.1
  deny_beep_count: 3
  alarm_beep_on_duration_s: 0.5
  alarm_beep_off_duration_s: 0.5

  # System / watchdog / sync / threads
  watchdog_check_interval_s: 2.0
  watchdog_stop_timeout_s: 2.0
  backend_sync_interval_s: 600
  thread_join_timeout_s: 5.0

  # Queue sizes
  sound_queue_maxsize: 20
  shift_queue_maxsize: 50
  mux_queue_maxsize: 100

# ── Логирование ──
# Уровни: DEBUG, INFO, WARNING, ERROR, CRITICAL
# Для дебага установите level: DEBUG и раскомментируйте нужные модули
logging:
  # Общий уровень логирования
  level: INFO
  # Формат логов
  format: "%(asctime)s %(name)s [%(levelname)s] %(message)s"

  # Детальная настройка по модулям - раскомментируйте для дебага
  loggers:
    # Инфраструктура (железо) - WARNING по умолчанию, DEBUG для дебага GPIO
    scud_lgtu.infrastructure.gpio.controller: WARNING
    scud_lgtu.infrastructure.gpio.shift_register: WARNING
    scud_lgtu.infrastructure.gpio.multiplexor: WARNING
    scud_lgtu.infrastructure.gpio.signal_reader: WARNING
    scud_lgtu.infrastructure.gpio.wiegand_reader: WARNING
    scud_lgtu.infrastructure.serial.qr_codec: WARNING

    # Доменный слой - INFO для бизнес-логики
    scud_lgtu.domain.turnstile: INFO
    scud_lgtu.domain.access: INFO

    # Application слой - INFO для обработки событий
    scud_lgtu.application.orchestration: INFO
    scud_lgtu.application.handlers: INFO
    scud_lgtu.application.services: INFO

    # Инфраструктура (кэш, бэкенд, хранилище) - WARNING
    scud_lgtu.infrastructure.cache: WARNING
    scud_lgtu.infrastructure.backend: WARNING
    scud_lgtu.infrastructure.persistence: WARNING

    # ScudEngine - WARNING для внутреннего цикла
    scud_lgtu.infrastructure.core.engine: WARNING

    # Системные логгеры
    asyncio: WARNING
